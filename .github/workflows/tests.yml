name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-client.txt
            experiments/requirements.txt
      - run: python -m pip install -r requirements-client.txt -r experiments/requirements.txt
      - run: python realtime_av_test.py --help
      - run: python -m experiments.scripts.hum_api --help
      - run: python -m unittest discover -s tests -v
